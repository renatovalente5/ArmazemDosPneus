# =====================================================================
# Backoffice (Pages CMS) — Armazém dos Pneus
# Gere Produtos, Imagens do site e Definições, sem tocar em código.
# Docs: https://pagescms.org/docs/
# =====================================================================

media:
  input: assets/uploads
  output: /assets/uploads

settings:
  merge: false

content:
  # ---------------- PRODUTOS ----------------
  - name: products
    label: Produtos
    type: file
    path: data/products.json
    icon: shopping-bag
    fields:
      - name: products
        label: Produtos
        type: object
        list: true
        fields:
          # O SKU é a chave usada no carrinho e na validação do pagamento.
          # Se mudar, os carrinhos guardados deixam de encontrar o produto.
          - { name: sku, label: "Código interno (SKU) — NÃO ALTERAR", type: string }
          - { name: name, label: Nome, type: string }
          - name: category
            label: Categoria
            type: select
            options:
              values: [Pneus Novos, Pneus Seminovos, Jantes, Baterias, Óleos, Acessórios]
          - { name: brand, label: Marca, type: string }
          - { name: size, label: "Medida / Especificação", type: string }
          - name: season
            label: Estação (pneus)
            type: select
            options:
              values: ["", Verão, Inverno, "4 Estações"]
          - name: condition
            label: Estado
            type: select
            options:
              values: [Novo, Seminovo]
          # Número, não texto: o preço é cobrado ao cliente. Um preço a 0 ou
          # vazio faz o produto deixar de ter botão "Adicionar".
          - { name: price_eur, label: "Preço em € (ex.: 89.90) — IVA e ecovalor incluídos", type: number }
          - { name: weight_kg, label: "Peso (kg) — para portes", type: number }
          - { name: stock, label: "Stock (unidades à venda online)", type: number }
          - { name: image, label: Imagem, type: image }

          # ---- Etiqueta UE (Reg. 2020/740) — SÓ pneus NOVOS ----
          - name: tyre_class
            label: "Etiqueta UE — Classe do pneu (só pneus novos)"
            type: select
            options:
              values: ["", C1, C2, C3]
          - { name: label_fuel, label: "Etiqueta UE — Combustível (A-E)", type: string }
          - { name: label_grip, label: "Etiqueta UE — Aderência em molhado (A-E)", type: string }
          - name: label_noise_class
            label: "Etiqueta UE — Classe de ruído (A/B/C) — obrigatória"
            type: select
            options:
              values: ["", A, B, C]
          - { name: label_noise_db, label: "Etiqueta UE — Ruído em dB (ex.: 71)", type: number }
          - { name: snow_3pmsf, label: "Etiqueta UE — Pictograma de neve (3PMSF)", type: boolean }
          - { name: ice_grip, label: "Etiqueta UE — Pictograma de gelo", type: boolean }
          - { name: eprel_id, label: "Etiqueta UE — ID EPREL (ficha do produto)", type: string }

          # ---- SÓ pneus SEMINOVOS (excluídos da etiqueta UE) ----
          - { name: dot, label: "Seminovo — Código DOT (ex.: 3221)", type: string }
          - { name: tread_mm, label: "Seminovo — Sulco medido em mm (ex.: 6)", type: number }
          - { name: warranty_months, label: "Seminovo — Garantia em meses (mínimo 12)", type: number }

          - { name: description, label: Descrição, type: text }
          - { name: featured, label: Mostrar como destaque, type: boolean }
          - { name: available, label: Disponível (à venda), type: boolean }

  # ---------------- IMAGENS DO SITE ----------------
  - name: content
    label: Imagens do site
    type: file
    path: data/content.json
    icon: image
    fields:
      - name: hero
        label: Destaque (topo)
        type: object
        fields:
          - { name: image, label: Imagem do topo, type: image }
      - name: sobre
        label: Sobre nós
        type: object
        fields:
          - { name: image, label: Imagem da secção "Sobre", type: image }

  # ---------------- DEFINIÇÕES ----------------
  - name: settings
    label: Definições
    type: file
    path: data/settings.json
    icon: settings
    fields:
      - name: store
        label: Loja
        type: object
        fields:
          - { name: name, label: Nome, type: string }
          - { name: phone, label: Telefone, type: string }
          - { name: whatsapp, label: "WhatsApp (ex.: 351935218857)", type: string }
          - { name: email, label: Email, type: string }
          - { name: address, label: Morada, type: string }
      - name: shipping
        label: Portes de envio
        type: object
        fields:
          - { name: free_pickup, label: Levantamento na loja grátis, type: boolean }
          - { name: pickup_label, label: "Texto do levantamento", type: string }
          - { name: note, label: "Nota dos portes", type: string }
          - name: tiers
            label: "Escalões de portes (por peso)"
            type: object
            list: true
            fields:
              - { name: max_kg, label: "Até (kg)", type: number }
              - { name: price, label: "Preço (€)", type: number }
      - name: delivery
        label: Prazos de entrega
        type: object
        fields:
          - { name: estimate_min_days, label: "Estimativa — mínimo (dias úteis)", type: number }
          - { name: estimate_max_days, label: "Estimativa — máximo (dias úteis)", type: number }
          - { name: max_days, label: "Prazo máximo legal (dias) — não passar de 30", type: number }
          - { name: countries_note, label: "Nota sobre zonas de entrega", type: string }
      - name: returns
        label: Devoluções
        type: object
        fields:
          # Sem este valor, a lei (DL 24/2014, art. 4.º n.º 5) diz que o
          # consumidor NÃO suporta os custos de devolução — ou seja, ficam
          # por conta da loja. Preencher com o preço real da transportadora.
          - { name: return_cost_eur, label: "Custo de devolução em € (obrigatório para o poder cobrar)", type: number }
          - { name: note, label: "Nota sobre devoluções", type: text }
      - name: mounting
        label: Montagem
        type: object
        fields:
          - { name: price_eur, label: "Preço da montagem em € (tem de estar publicado)", type: number }
          - { name: note, label: "Nota sobre a montagem", type: text }
      - name: payment
        label: Pagamento
        type: object
        fields:
          # Interruptor de emergência. "online" = a loja cobra normalmente.
          # "reserva" = deixa de aceitar pagamentos e encaminha os clientes para
          # telefone/WhatsApp. É imposto também no servidor, não é só um aviso.
          - name: mode
            label: "Pagamentos online — LIGADOS (online) ou DESLIGADOS (reserva)"
            type: select
            options:
              values: [online, reserva]
          - { name: note, label: "Nota de pagamento (mostrada no checkout)", type: text }
