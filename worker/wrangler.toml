name = "armazem-dos-pneus-pay"
main = "src/index.js"
compatibility_date = "2026-07-01"

[observability]
enabled = true

# Namespace KV das encomendas. Criar com:
#   npx wrangler kv namespace create ORDERS
# e colar aqui o id devolvido (e o preview_id para `wrangler dev`).
[[kv_namespaces]]
binding = "ORDERS"
id = "fe11533f26664a4194853d5c4aa1e9e4"
preview_id = "0870815be1eb4fc19ea338ca0e376686"

# Travão do /checkout que vale para TODOS os isolates (o de memória, em
# src/index.js, só vale para o seu): 5 pedidos por minuto por IP, contados em
# cada localização da Cloudflare. Cada /checkout aceite grava no KV, e a quota
# de 1 000 escritas/dia é da conta inteira — um script esgotava-a e o checkout
# e os webhooks ficavam em 500 até à meia-noite UTC. O namespace_id é único na
# conta: o 1001 e o 1002 são do carimbo.
[[ratelimits]]
name = "TRAVAO_CHECKOUT"
namespace_id = "1101"
simple = { limit = 5, period = 60 }

[vars]
# Origens autorizadas a chamar /checkout (separadas por vírgula).
# O renatovalente5.github.io NÃO consta de propósito: com o domínio próprio
# configurado, o GitHub Pages responde 301 para armazemdospneus.pt e nenhum
# browser fica nessa origem. Menos superfície.
# O http://localhost:8096 do ensaio também NÃO consta (estava aqui e respondia em
# produção): em local, `npm run dev` junta-o com --var.
ALLOWED_ORIGINS = "https://armazemdospneus.pt,https://www.armazemdospneus.pt"

# Base pública do site (usada nos links dos emails legais).
SITE_URL = "https://armazemdospneus.pt"

# Catálogo e definições — lidos pelo servidor para revalidar preços e portes.
PRODUCTS_URL = "https://armazemdospneus.pt/data/products.json"
SETTINGS_URL = "https://armazemdospneus.pt/data/settings.json"

# O que se promete ao cliente e que o dono muda no painel (src/termos.js):
#   settings.json  delivery.* (prazos), returns.return_cost_eur (devolução)
#   site.json      contactos.telefone, contactos.email
#   empresa.json   denominação, NIF, morada, Livro de Reclamações
# Lidos no /checkout com a mesma cache de 60 s, e guardados na encomenda (o
# «retrato» que os emails repetem). Enquanto um ficheiro não existir (404) ou
# trouxer um valor fora da regra, vale o RECURSO: STORE_PHONE, STORE_EMAIL e
# DELIVERY_* abaixo, e a empresa escrita em src/termos.js.
SITE_DATA_URL = "https://armazemdospneus.pt/data/site.json"
EMPRESA_URL = "https://armazemdospneus.pt/data/empresa.json"

SUCCESS_URL = "https://armazemdospneus.pt/obrigado.html"
CANCEL_URL = "https://armazemdospneus.pt/checkout.html?cancelado=1"

# Email. O domínio armazemdospneus.pt está verificado no Resend (DKIM + SPF +
# MX no subdomínio "send", mais DMARC p=none), na conta do próprio cliente —
# registada no Gmail da loja, para que os dados dos clientes finais e a
# reputação de envio fiquem com o negócio a que pertencem.
# Com o domínio verificado, o Resend entrega a terceiros, o que é o que permite
# enviar ao CLIENTE a confirmação exigida pelo art. 6.º do DL 24/2014.
MAIL_FROM = "Armazém dos Pneus <encomendas@armazemdospneus.pt>"

# MAIL_TO — destinatário do aviso INTERNO de encomenda paga (com o NIF, para
# emitir a fatura). NÃO está aqui de propósito: o repositório é público (é o que
# torna o GitHub Pages gratuito) e o próprio wrangler.toml é servido em
# armazemdospneus.pt/worker/wrangler.toml, o que exporia um email pessoal aos
# recolhedores de spam. Definir com:
#   npx wrangler secret put MAIL_TO

# STORE_EMAIL — contacto PÚBLICO da loja (RECURSO: vale o contactos.email do
# site.json quando existir). Aparece no email ao cliente e é o reply-to das
# mensagens que ele recebe. Não confundir com o MAIL_TO: o cliente tem de ver e
# responder ao email oficial da loja, não ao de quem a gere.
STORE_EMAIL = "armazemdospneus2019@gmail.com"

# RECURSO: vale o contactos.telefone do site.json quando existir.
STORE_PHONE = "935 218 857"

# Versão da API fixada. Não subir sem ler o changelog: foi em 2026-03-25.dahlia
# que os valores de ui_mode passaram a hosted_page/embedded_form/elements.
STRIPE_API_VERSION = "2026-07-29.dahlia"

# Prazos mostrados ao cliente — RECURSO: valem os de settings.json (delivery.*),
# que o dono muda no painel, sempre que estiverem dentro da regra.
DELIVERY_MIN_DAYS = "2"
DELIVERY_MAX_BUSINESS_DAYS = "5"
DELIVERY_MAX_DAYS = "30"

# Pôr a "true" só depois de configurar o URL dos Termos em
# Stripe → Settings → Branding. Sem esse URL a Stripe rejeita a sessão.
REQUIRE_TOS_CONSENT = "false"

# ---------------------------------------------------------------------------
# SEGREDOS — NUNCA aqui. Definir com:
#   npx wrangler secret put STRIPE_RESTRICTED_KEY   # rk_live_… (não sk_live)
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET   # whsec_…
#   npx wrangler secret put RESEND_API_KEY          # re_…
# Em local, os mesmos nomes com valores de TESTE vão para .dev.vars (gitignored).
# ---------------------------------------------------------------------------
