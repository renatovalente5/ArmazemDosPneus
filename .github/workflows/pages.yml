# =============================================================
# Publicação no GitHub Pages
# -------------------------------------------------------------
# Substitui o build "legacy" do Pages, que falhava com a mensagem genérica
# "Page build failed" sem dar registos — impossível de diagnosticar. Por
# Actions, cada passo fica registado.
#
# Ganho adicional: aqui escolhemos O QUE é publicado. O build legacy servia o
# repositório inteiro, incluindo armazemdospneus.pt/worker/wrangler.toml (ids
# do KV, origens permitidas) e os ficheiros .md internos. Nada disso são
# segredos, mas também não têm razão para estar públicos, e um Disallow no
# robots.txt esconde do Google e não do público.
# =============================================================
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez, sem cancelar a que já está a correr.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4

      - name: Instalar o que reduz as fotos
        # O injetar-imagens.py usa Pillow para converter as fotos do backoffice
        # em JPEG redimensionado. Sem isto o passo seguinte falha — de
        # propósito: mais vale a publicação parar do que publicar um PNG de
        # 2,4 MB no topo da página inicial.
        run: python3 -m pip install --quiet 'pillow>=10,<12'

      - name: Preparar o que vai ser publicado
        run: |
          mkdir -p _site
          # Copia tudo menos o que não deve ser servido ao público.
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'worker' \
            --exclude '_source' \
            --exclude '*.md' \
            --exclude '.gitignore' \
            --exclude '.pages.yml'
          # O .pages.yml é a configuração do backoffice. O Pages CMS lê-o do
          # repositório, não do site, por isso excluí-lo não lhe faz falta —
          # e estava a ser servido em armazemdospneus.pt/.pages.yml.
          # O .nojekyll TEM de sobreviver: sem ele o Jekyll corre e ignora
          # pastas começadas por underscore.
          touch _site/.nojekyll
          # Escreve no HTML as fotos escolhidas no backoffice. Sem isto, o
          # index.html publicava o caminho antigo e o main.js trocava-o já
          # depois de a pagina estar pintada — via-se a foto antiga e logo a
          # nova, e as duas eram descarregadas. Ver .github/injetar-imagens.py.
          echo "--- imagens do backoffice ---"
          python3 .github/injetar-imagens.py _site data/content.json
          echo "--- ficheiros publicados ---"
          find _site -type f | sort | sed 's|^_site/|  |'
          echo "--- verificações ---"
          test -f _site/index.html      || { echo "FALTA index.html"; exit 1; }
          test -f _site/CNAME           || { echo "FALTA CNAME (domínio próprio)"; exit 1; }
          test -f _site/.nojekyll       || { echo "FALTA .nojekyll"; exit 1; }
          test ! -d _site/worker        || { echo "worker/ NÃO devia ser publicado"; exit 1; }
          test ! -e _site/.pages.yml    || { echo ".pages.yml NÃO devia ser publicado"; exit 1; }
          test -z "$(find _site -name '*.md')" || { echo "ficheiros .md NÃO deviam ser publicados"; exit 1; }
          echo "ok"

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar o artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
