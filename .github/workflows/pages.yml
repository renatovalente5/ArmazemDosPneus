# =============================================================
# Publicação na Cloudflare
# -------------------------------------------------------------
# Desde 27 set 2026 o site vive num Worker da Cloudflare só de ficheiros
# («armazem-dos-pneus-site», wrangler.jsonc na raiz, route
# armazemdospneus.pt/*). Saiu do GitHub Pages porque os termos do GitHub
# Pages proíbem lojas.
#
# Aqui escolhemos O QUE é publicado: nunca o repositório inteiro. Ficam de
# fora worker/ (ids do KV, origens permitidas), os ficheiros .md internos e a
# configuração do backoffice. Nada disso são segredos, mas também não têm
# razão para estar públicos, e um Disallow no robots.txt esconde do Google e
# não do público.
# =============================================================
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Uma publicação de cada vez, sem cancelar a que já está a correr.
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4

      - name: Instalar o que reduz as fotos
        # O injetar-imagens.py usa Pillow para converter as fotos do backoffice
        # em JPEG redimensionado. Sem isto o passo seguinte falha — de
        # propósito: mais vale a publicação parar do que publicar um PNG de
        # 2,4 MB no topo da página inicial.
        run: python3 -m pip install --quiet 'pillow>=10,<12'

      - name: Preparar o que vai ser publicado
        run: |
          mkdir -p _site
          # Copia tudo menos o que não deve ser servido ao público.
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'worker' \
            --exclude '_source' \
            --exclude '*.md' \
            --exclude '.gitignore' \
            --exclude '.pages.yml' \
            --exclude 'wrangler.jsonc'
          # O .pages.yml é a configuração do backoffice. O Pages CMS lê-o do
          # repositório, não do site, por isso excluí-lo não lhe faz falta —
          # e estava a ser servido em armazemdospneus.pt/.pages.yml.
          # Escreve no HTML as fotos escolhidas no backoffice. Sem isto, o
          # index.html publicava o caminho antigo e o main.js trocava-o já
          # depois de a pagina estar pintada — via-se a foto antiga e logo a
          # nova, e as duas eram descarregadas. Ver .github/injetar-imagens.py.
          echo "--- imagens do backoffice ---"
          python3 .github/injetar-imagens.py _site data/content.json
          echo "--- ficheiros publicados ---"
          find _site -type f | sort | sed 's|^_site/|  |'
          echo "--- verificações ---"
          test -f _site/index.html      || { echo "FALTA index.html"; exit 1; }
          test ! -d _site/worker        || { echo "worker/ NÃO devia ser publicado"; exit 1; }
          test ! -e _site/.pages.yml    || { echo ".pages.yml NÃO devia ser publicado"; exit 1; }
          test -z "$(find _site -name '*.md')" || { echo "ficheiros .md NÃO deviam ser publicados"; exit 1; }
          echo "ok"

      # O Worker só de ficheiros de wrangler.jsonc. Precisa do segredo
      # CLOUDFLARE_API_TOKEN (modelo «Edit Cloudflare Workers», limitado à
      # zona armazemdospneus.pt, criado pelo dono da conta) e da variável
      # CLOUDFLARE_ACCOUNT_ID. Sem o segredo, a publicação FALHA — de
      # propósito: melhor um CI vermelho do que edições do backoffice que
      # nunca chegam ao site.
      - name: Preparar para a Cloudflare
        run: .github/preparar-cloudflare.sh _site

      - name: Publicar na Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.141.0'
          command: deploy
